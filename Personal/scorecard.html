<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Smartscorecard</title>
        <style>
            body{
                background-color:green;
            }
            h1{
                text-align:center;
                color:white;
            }
            h3{
                color:white;
            }
            dl{
                color:white;
            }
            nav{
                text-align:center;
            }
            .card{
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 8px 16px;
                border: 2px solid;
                border-color:white;
                padding: 12px;
                border-radius: 10px;
                max-width: 80px;
            }
            .card dt{
                font-weight:bold;
            }
            .card dd{
                font-style:italic;
            }
        </style>
    </head>
    <header>
        <h1>Scorecard</h1>
    </header>
    <nav>
        <a href="#card">Home</a>
        <a href="#course">Course</a>
    </nav>
    <main>
        <section>
            <h3>Hole  |  Score</h3>
            <dl class="card">
                <dt>1</dt>
                <dd>4</dd>
                <dt>2</dt>
                <dd>4</dd>
                <dt>3</dt>
                <dd>4</dd>
                <dt>4</dt>
                <dd>4</dd>
                <dt>5</dt>
                <dd>4</dd>
                <dt>6</dt>
                <dd>4</dd>
                <dt>7</dt>
                <dd>4</dd>
                <dt>8</dt>
                <dd>4</dd>
                <dt>9</dt>
                <dd>4</dd>
            </dl>
        </section>
    </main>
</html>
