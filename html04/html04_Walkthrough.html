<!DOCTYPE html>
<html lang="en">
<head>

  <title>Wireless Headphones</title>
  <!-- The block below is CSS. It only draws borders on tables so you can
       see rows and cells. CSS is Lesson 05 - leave this alone for now. -->
       <!-- border: adds a 1px solid dark line around the table and cells -->
  <!-- border-collapse: merges double cell borders into a single clean line -->
  <!-- padding: adds 6px of inner space between cell borders and text -->
  <style>
    table, th, td { border: 1px solid #333; border-collapse: collapse; }
    th, td { padding: 6px; }
  </style>
</head>
<body>

  <header>

    </figure>
    <figure>
        <img src="Images/product-view-2.jpg" alt="Side view of wireless headphones" style="width: 400px;">
        <figcaption>Side view of wireless headphones</figcaption>
    </figure>
    <figure>
        <img src="Images/product-view-3.jpg" alt="Hanging view of wireless headphones" style="width: 100%; border: 2px solid black;">
