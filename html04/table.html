<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {border: 5px solid #333; border-collapse: collapse;}
        th, td {padding: 10px;}
        th {background-color: rgb(88, 164, 235);}
    </style>
</head>
<body>
    <h1>Lunch Menu</h1>
    <table>
        <caption>Weekly Lunch Menu</caption>
        <tr>
            <th>Day</th>
            <th>Main</th>
            <th>Side</th>
        </tr>
        <tr>
            <td>Mon</td>
            <td>Pizza</td>
            <td>Salad</td>
        </tr>
        <tr>
            <td>Tue</td>
            <td>Tacos</td>
            <td>Rice</td>
        </tr>
        <tr>
            <td>Wed</td>
            <td>Chicken</td>
            <td>Beans</td>
        </tr>
        <tr>
            <td>Thu</td>
            <td>Burger</td>
            <td>Fries</td>
        </tr>
        <tr>
            <td>Fri</td>
            <td colspan="2">No School - Holiday</td>
        </tr>
    </table>
</body>
</html>
