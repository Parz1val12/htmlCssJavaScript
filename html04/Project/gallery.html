<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skateboarding For Beginers</title>
    <style>
        table, th, td {border: 5px solid #333; border-collapse: collapse;}
        th, td {padding: 10px;}
        th {background-color: rgb(88, 164, 235);}
    </style>
</head>
<body>
    <h1>Skateboarding For Beginers</h1>
    <video width="500px" height="auto" controls>
        <source src="video/ian.mp4">
    </video>
    <h2>Types Of Skateboards</h2>
    <figure>
        <img src="images/skate.jpg"
        alt="regular skateboard"
        width="200px"
        height="auto">
        <figcaption>regular skateboard</figcaption>
    </figure>
    <figure>
        <img src="images/long.jpg"
        alt="person riding a longboard at high speeds"
        width="200px"
        height="auto">
        <figcaption>longboard</figcaption>
    </figure>
    <figure>
        <img src="images/penny.jpg"
        alt="penny board"
        width="200px"
        height="auto">
        <figcaption>penny board</figcaption>
    </figure>
    <table>
        <caption>Comparison to other courses</caption>
        <tr>
            <th>Course</th>
            <th>Prise</th>
            <th>Learning curve</th>
        </tr>
        <tr>
            <td>Ours</td>
            <td>$0.00</td>
            <td>Easy</td>
        </tr>
        <tr>
            <td>Skate IQ</td>
            <td>$99.00</td>
            <td>Professional</td>
        </tr>
        <tr>
            <td>Braille Skateboarding</td>
            <td>$49.99</td>
            <td>Intermediate to Advanced</td>
        </tr>
        <tr>
            <td>Aunty Skates</td>
            <td>$57.00</td>
            <td>High</td>
        </tr>
    </table>
</body>
</html>
